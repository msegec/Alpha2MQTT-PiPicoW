      unit_of_measurement: "W"
      device_class: power
      expire_after: 10
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Battery Power Fast"
