      state_topic: "Alpha2MQTT/state/second/ten"
      value_template: "{{ value_json.REG_GRID_METER_R_TOTAL_ACTIVE_POWER_1 | default(None) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 60
