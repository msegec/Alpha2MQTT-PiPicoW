    # Fast state for a control loop, published every second. No state_class, the ten second
    # sensors above keep the long term statistics. To keep the database small, exclude them:
    #   recorder:
    #     exclude:
    #       entity_globs: ["sensor.alpha2mqtt_*_fast"]
    # An automation can trigger on the topic itself and read trigger.payload_json.seq to spot gaps.
    - name: "Grid Power Fast"
      unique_id: alpha2mqtt_fast_grid_power
      state_topic: "Alpha2MQTT/state/fast"
      value_template: "{{ value_json.REG_GRID_METER_R_TOTAL_ACTIVE_POWER_1 | default(None) }}"
      unit_of_measurement: "W"
      device_class: power
      expire_after: 10
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "PV Meter Power Fast"
      unique_id: alpha2mqtt_fast_pv_meter_power
      state_topic: "Alpha2MQTT/state/fast"
      # The firmware leaves out a lone 0 until a second read confirms it. Keep the last value through
      # that gap: an unavailable PV meter takes the net demand, and with it the battery controller, down.
      # held_since marks the first message of a gap, so the hold ends 10 s into it however long the
      # value was steady before. HA may run the two templates in either order; both give the same result.
      value_template: >-
        {%- set k = 'REG_PV_METER_R_TOTAL_ACTIVE_POWER_1' -%}
        {%- set since = this.attributes.held_since | default(None) -%}
        {%- if value_json is mapping and k in value_json -%}{{ value_json[k] }}
        {%- elif this.state not in ('unknown', 'unavailable') and (since is none or now() - as_datetime(since) < timedelta(seconds=10)) -%}{{ this.state }}
        {%- else -%}None{%- endif -%}
      json_attributes_topic: "Alpha2MQTT/state/fast"
      json_attributes_template: >-
        {%- set k = 'REG_PV_METER_R_TOTAL_ACTIVE_POWER_1' -%}
        {%- if value_json is mapping and k in value_json -%}{{ {'held_since': none} | tojson }}
        {%- else -%}{{ {'held_since': this.attributes.held_since | default(none) or now().isoformat()} | tojson }}
        {%- endif -%}
      unit_of_measurement: "W"
      device_class: power
      expire_after: 10
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Battery Power Fast"
      unique_id: alpha2mqtt_fast_battery_power
      state_topic: "Alpha2MQTT/state/fast"
      value_template: "{{ value_json.REG_BATTERY_HOME_R_BATTERY_POWER | default(None) }}"
      unit_of_measurement: "W"
      device_class: power
      expire_after: 10
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Read Time Fast"
      unique_id: alpha2mqtt_fast_read_time
      state_topic: "Alpha2MQTT/state/fast"
      value_template: "{{ value_json.read_ms | default(None) }}"
      unit_of_measurement: "ms"
      device_class: duration
      entity_category: diagnostic
      expire_after: 10
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    # Pico W only: its own supply, published every minute
    - name: "Pico VSYS"
      unique_id: alpha2mqtt_pico_vsys
      state_topic: "Alpha2MQTT/state/device"
      value_template: "{{ (value_json.vsys_mv / 1000) | round(2) if value_json.vsys_mv is defined else None }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      entity_category: diagnostic
      expire_after: 300
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
  binary_sensor:
    - name: "Pico USB Power"
      unique_id: alpha2mqtt_pico_usb_power
      state_topic: "Alpha2MQTT/state/device"
      value_template: "{{ 'ON' if value_json.usb_power else 'OFF' }}"
      device_class: plug
      entity_category: diagnostic
      expire_after: 300
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    # On while the firmware counts Home Assistant as gone and holds the battery idle itself.
    # Unknown on firmware that does not send haIdle.
    - name: "Idle Hold"
      unique_id: alpha2mqtt_fast_ha_idle
      state_topic: "Alpha2MQTT/state/fast"
      value_template: >-
        {%- set v = value_json.haIdle | default(None) | int(None) -%}
        {%- if v is none -%}None{%- elif v == 1 -%}ON{%- else -%}OFF{%- endif -%}
      expire_after: 10
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"

# One writer at a time. The battery controller, if installed, sends a command every few seconds and would
# overwrite a script's command, so each script turns the controller's Enabled switch off first. Turning it
# off sends set/normal, then the script's own command follows. Turn Enabled back on to hand control back.
script:
  alpha2mqtt_set_charge:
    alias: "Alpha2MQTT Charge"
    description: "Charge the battery through dispatch mode for a fixed time, then hand control back to the inverter."
    mode: single
    fields:
      watts:
        description: "Power in watts. The inverter caps this at what it supports."
        required: true
        default: 3000
        selector:
          number: {min: 0, max: 10000, step: 100, unit_of_measurement: W}
      soc_percent:
        description: "Stop at this battery SOC."
        required: true
        default: 100
        selector:
          number: {min: 0, max: 100, step: 1, unit_of_measurement: "%"}
      duration:
        description: "Seconds to stay in dispatch mode. The inverter returns to its own mode after it."
        required: true
        default: 600
        selector:
          number: {min: 60, max: 86400, step: 60, unit_of_measurement: s}
      controller_switch:
        description: "Enabled switch of the battery controller, turned off first. Skipped when it does not exist."
        default: switch.alpha2mqtt_battery_controller_enabled
        selector:
          entity: {domain: switch}
    sequence:
      # Field defaults only fill the UI form. A run without data, such as a tap in the car app,
      # would publish zeros, so stop unless all three values were given.
      - condition: template
        value_template: "{{ watts is defined and soc_percent is defined and duration is defined }}"
      - if: "{{ is_state(controller_switch | default('switch.alpha2mqtt_battery_controller_enabled'), 'on') }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: "{{ controller_switch | default('switch.alpha2mqtt_battery_controller_enabled') }}"
      - action: mqtt.publish
        data:
          topic: "Alpha2MQTT/request/set/charge"
          payload: >-
            {"watts": {{ watts | int }}, "socPercent": {{ soc_percent | int }}, "duration": {{ duration | int }}}
  alpha2mqtt_set_discharge:
    alias: "Alpha2MQTT Discharge"
    description: "Discharge the battery through dispatch mode for a fixed time, then hand control back to the inverter."
    mode: single
    fields:
      watts:
        description: "Power in watts. The inverter caps this at what it supports."
        required: true
        default: 3000
        selector:
          number: {min: 0, max: 10000, step: 100, unit_of_measurement: W}
      soc_percent:
        description: "Stop at this battery SOC."
        required: true
        default: 10
        selector:
          number: {min: 0, max: 100, step: 1, unit_of_measurement: "%"}
      duration:
        description: "Seconds to stay in dispatch mode. The inverter returns to its own mode after it."
        required: true
        default: 600
        selector:
          number: {min: 60, max: 86400, step: 60, unit_of_measurement: s}
      controller_switch:
        description: "Enabled switch of the battery controller, turned off first. Skipped when it does not exist."
        default: switch.alpha2mqtt_battery_controller_enabled
        selector:
          entity: {domain: switch}
    sequence:
      # Field defaults only fill the UI form. A run without data, such as a tap in the car app,
      # would publish zeros, so stop unless all three values were given.
      - condition: template
        value_template: "{{ watts is defined and soc_percent is defined and duration is defined }}"
      - if: "{{ is_state(controller_switch | default('switch.alpha2mqtt_battery_controller_enabled'), 'on') }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: "{{ controller_switch | default('switch.alpha2mqtt_battery_controller_enabled') }}"
      - action: mqtt.publish
        data:
          topic: "Alpha2MQTT/request/set/discharge"
          payload: >-
            {"watts": {{ watts | int }}, "socPercent": {{ soc_percent | int }}, "duration": {{ duration | int }}}
  alpha2mqtt_set_normal:
    alias: "Alpha2MQTT Normal"
    description: "End dispatch mode and hand control back to the inverter."
    mode: single
    fields:
      controller_switch:
        description: "Enabled switch of the battery controller, turned off first. Skipped when it does not exist."
        default: switch.alpha2mqtt_battery_controller_enabled
        selector:
          entity: {domain: switch}
    sequence:
      - if: "{{ is_state(controller_switch | default('switch.alpha2mqtt_battery_controller_enabled'), 'on') }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: "{{ controller_switch | default('switch.alpha2mqtt_battery_controller_enabled') }}"
      - action: mqtt.publish
        data:
          topic: "Alpha2MQTT/request/set/normal"
          payload: '{"void": 0}'
