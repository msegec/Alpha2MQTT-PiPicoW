# Alpha2MQTT for Home Assistant. Copy to /config/packages/alpha2mqtt.yaml and enable packages:
#   homeassistant:
#     packages: !include_dir_named packages
# Sensors read the JSON the device publishes on Alpha2MQTT/state/*. A register the device
# failed to read is left out of that JSON, so its sensor becomes unknown until the next good read.
# Sensors go unavailable if their topic is silent for several publish periods.

mqtt:
  sensor:
    - name: "Battery SOC"
      unique_id: alpha2mqtt_battery_home_r_soc
      state_topic: "Alpha2MQTT/state/second/ten"
      value_template: "{{ value_json.REG_BATTERY_HOME_R_SOC | default(None) }}"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      expire_after: 60
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Battery Power"
      unique_id: alpha2mqtt_battery_home_r_battery_power
      state_topic: "Alpha2MQTT/state/second/ten"
      value_template: "{{ value_json.REG_BATTERY_HOME_R_BATTERY_POWER | default(None) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 60
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Battery Voltage"
      unique_id: alpha2mqtt_battery_home_r_voltage
      state_topic: "Alpha2MQTT/state/second/ten"
      value_template: "{{ value_json.REG_BATTERY_HOME_R_VOLTAGE | default(None) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      expire_after: 60
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Battery Current"
      unique_id: alpha2mqtt_battery_home_r_current
      state_topic: "Alpha2MQTT/state/second/ten"
      value_template: "{{ value_json.REG_BATTERY_HOME_R_CURRENT | default(None) }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      expire_after: 60
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Battery Max Cell Temperature"
      unique_id: alpha2mqtt_battery_home_r_max_cell_temperature
      state_topic: "Alpha2MQTT/state/second/ten"
      value_template: "{{ value_json.REG_BATTERY_HOME_R_MAX_CELL_TEMPERATURE | default(None) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      expire_after: 60
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Grid Power"
      unique_id: alpha2mqtt_grid_meter_r_total_active_power_1
      state_topic: "Alpha2MQTT/state/second/ten"
      value_template: "{{ value_json.REG_GRID_METER_R_TOTAL_ACTIVE_POWER_1 | default(None) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 60
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Grid Current"
      unique_id: alpha2mqtt_custom_grid_current_a_phase
      state_topic: "Alpha2MQTT/state/second/ten"
      value_template: "{{ value_json.REG_CUSTOM_GRID_CURRENT_A_PHASE | default(None) }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      expire_after: 60
