      state_topic: "Alpha2MQTT/state/second/ten"
      value_template: "{{ value_json.REG_INVERTER_HOME_R_CURRENT_L1 | default(None) }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      expire_after: 60
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Inverter Power"
      unique_id: alpha2mqtt_inverter_home_r_power_l1_1
      state_topic: "Alpha2MQTT/state/second/ten"
      # The inverter puts a signed 16-bit value in the low word: 62511 means -3025 W.
      value_template: >-
        {%- set v = value_json.REG_INVERTER_HOME_R_POWER_L1_1 | default(None) | int(None) -%}
        {%- if v is none -%}None{%- elif 32768 <= v < 65536 -%}{{ v - 65536 }}{%- else -%}{{ v }}{%- endif -%}
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 60
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Inverter Temperature"
