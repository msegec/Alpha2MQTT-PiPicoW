# Alpha2MQTT for Home Assistant. Copy to /config/packages/alpha2mqtt.yaml and enable packages:
#   homeassistant:
#     packages: !include_dir_named packages
# Sensors read the JSON the device publishes on Alpha2MQTT/state/*. A register the device
# failed to read is left out of that JSON, so its sensor becomes unknown until the next good read.
# Sensors go unavailable if their topic is silent for several publish periods.
# Energy totals only ever rise. A total that reads 0, falls, or jumps over 100 kWh in one publish
# keeps its last value: HA would book a 0 then the real total as a reset worth the whole total.
# With no last value, after a restart or a silence, a total is taken only if it is a number above 0
# and below 1000000 kWh, which no house meter reaches but a misread 32 bit word can.

mqtt:
  sensor:
    - name: "Battery SOC"
      unique_id: alpha2mqtt_battery_home_r_soc
      state_topic: "Alpha2MQTT/state/second/ten"
      value_template: "{{ value_json.REG_BATTERY_HOME_R_SOC | default(None) }}"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      expire_after: 60
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Battery Power"
      unique_id: alpha2mqtt_battery_home_r_battery_power
      state_topic: "Alpha2MQTT/state/second/ten"
      value_template: "{{ value_json.REG_BATTERY_HOME_R_BATTERY_POWER | default(None) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 60
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
        manufacturer: "AlphaESS"
        model: "Alpha2MQTT"
    - name: "Battery Voltage"
      unique_id: alpha2mqtt_battery_home_r_voltage
      state_topic: "Alpha2MQTT/state/second/ten"
      value_template: "{{ value_json.REG_BATTERY_HOME_R_VOLTAGE | default(None) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      expire_after: 60
      device:
        identifiers: ["alpha2mqtt"]
        name: "Alpha2MQTT"
